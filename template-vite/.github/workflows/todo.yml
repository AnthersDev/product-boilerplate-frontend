name: Todo Checker

# Runs on the developer's pull request branch. It never pushes to main.
# Issue-link edits are committed on that branch; issue closure waits for the merged closed event.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: todo-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  todo:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'closed' || github.event.pull_request.merged)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@v5.1.10
        id: todo
        with:
          INSERT_ISSUE_URLS: 'true'
          CLOSE_ISSUES: ${{ github.event.action == 'closed' && github.event.pull_request.merged }}
          DIFF_URL: ${{ github.api_url }}/repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

      - name: Commit issue links onto the pull request branch
        if: github.event.action != 'closed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "chore: add GitHub issue links to TODOs"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "No changes to commit"
          fi
